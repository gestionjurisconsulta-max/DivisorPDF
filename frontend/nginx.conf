server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los PDFs de facturas agrupadas pesan: el de muestra ronda los 10 MB.
    client_max_body_size 200M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API, al contenedor del backend (el nombre lo resuelve la red de compose)
    location /api/ {
        proxy_pass http://backend:9088;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El OCR de un PDF largo y girado tarda minutos: sin esto, nginx corta
        # la conexión a los 60 s y la Mesa de Trabajo se queda sin respuesta.
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # El ZIP se devuelve de una pieza; no conviene que nginx lo acumule.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Los assets con hash en el nombre se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier otra ruta la resuelve React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
